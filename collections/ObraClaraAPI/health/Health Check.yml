info:
  name: Health Check
  type: http
  seq: 5
  tags:
    - health

http:
  method: GET
  url: "{{baseUrl}}/health/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/health/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: alt-svc
          value: h3=":443"; ma=2592000
        - name: content-language
          value: es
        - name: content-length
          value: "16"
        - name: content-type
          value: application/json
        - name: cross-origin-opener-policy
          value: same-origin
        - name: date
          value: Thu, 21 May 2026 08:07:34 GMT
        - name: referrer-policy
          value: same-origin
        - name: server
          value: gunicorn
        - name: strict-transport-security
          value: max-age=3600; includeSubDomains; preload
        - name: vary
          value: Accept-Encoding, Accept-Language, origin
        - name: x-content-type-options
          value: nosniff
        - name: x-frame-options
          value: DENY
      body:
        type: json
        data: |-
          {
            "status": "ok"
          }

docs: |-
  Liveness probe for the container orchestrator. Returns `{"status": "ok"}`.
  It runs no query, so it stays up while the database is down.
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });

    test("Response is JSON", function() {
      const contentType = res.getHeader("Content-Type");
      expect(contentType).to.contain("application/json");
    });
