info:
  name: Health Check
  type: http
  seq: 5
  tags:
    - reports

http:
  method: GET
  url: "{{baseUrl}}/health/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/health/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: alt-svc
          value: h3=":443"; ma=2592000
        - name: content-language
          value: es
        - name: content-length
          value: "16"
        - name: content-type
          value: application/json
        - name: cross-origin-opener-policy
          value: same-origin
        - name: date
          value: Thu, 21 May 2026 08:07:34 GMT
        - name: referrer-policy
          value: same-origin
        - name: server
          value: gunicorn
        - name: strict-transport-security
          value: max-age=3600; includeSubDomains; preload
        - name: vary
          value: Accept-Encoding, Accept-Language, origin
        - name: x-content-type-options
          value: nosniff
        - name: x-frame-options
          value: DENY
      body:
        type: json
        data: |-
          {
            "status": "ok"
          }

docs: |-
  List reports for a project.
  VIEWER/CLIENT only see published reports. OWNER and COLLABORATOR see all.
