info:
  name: Restore
  type: http
  seq: 9
  tags:
  - stages
http:
  method: POST
  url: '{{baseUrl}}/api/v1/projects/:project_pk/stages/:id/restore/'
  params:
  - name: project_pk
    value: ''
    type: path
  - name: id
    value: ''
    type: path
    description: UUID of the soft-deleted stage.
  - name: cascade
    value: ''
    type: query
    description: 'If true, also restores rows that share the original delete_batch_id.'
    disabled: true
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
- name: 200 Response
  request:
    url: '{{baseUrl}}/api/v1/projects/:project_pk/stages/:id/restore/'
    method: POST
    params:
    - name: project_pk
      value: ''
      type: path
    - name: id
      value: ''
      type: path
    - name: cascade
      value: ''
      type: query
      disabled: true
  response:
    status: 200
    statusText: OK
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "id": "",
          "name": "",
          "percentage": "0.00",
          "budget_estimated": null,
          "order": 0,
          "total_progress": "0.00",
          "total_spent": "0.00",
          "created": "",
          "modified": ""
        }
docs: |-
  Restore a soft-deleted stage. With cascade=true, also restores rows that
  share the original delete_batch_id. Orphaned children are NOT re-linked.
  Responds 400 if the parent project is still soft-deleted. Permission:
  OWNER only.
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });

    test("Response is JSON", function() {
      const contentType = res.getHeader("Content-Type");
      expect(contentType).to.contain("application/json");
    });
