info:
  name: Delete Preview
  type: http
  seq: 8
  tags:
  - stages
http:
  method: GET
  url: '{{baseUrl}}/api/v1/projects/:project_pk/stages/:id/delete-preview/'
  params:
  - name: project_pk
    value: ''
    type: path
  - name: id
    value: ''
    type: path
    description: UUID of the stage.
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
- name: 200 Response
  request:
    url: '{{baseUrl}}/api/v1/projects/:project_pk/stages/:id/delete-preview/'
    method: GET
    params:
    - name: project_pk
      value: ''
      type: path
    - name: id
      value: ''
      type: path
  response:
    status: 200
    statusText: OK
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "links": {
            "progress_entries": {"count": 0}
          },
          "warnings": [
            "Linked expenses and incidents on the affected entries will be orphaned (kept in the project total)."
          ],
          "defaults": {
            "progress_entries": "orphan"
          }
        }
docs: |-
  Cascade preview for soft-deleting a stage. Returns the count of
  progress_entries that will be affected, the warning list, and the default
  cascade choices. Permission: OWNER only.
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });

    test("Response is JSON", function() {
      const contentType = res.getHeader("Content-Type");
      expect(contentType).to.contain("application/json");
    });
