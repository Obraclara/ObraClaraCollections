info:
  name: Get by Token
  type: http
  seq: 3
  tags:
  - invitations
http:
  method: GET
  url: '{{baseUrl}}/api/v1/invitations/:identifier/'
  params:
  - name: identifier
    value: ''
    type: path
    description: Invitation token (URL-safe) or short 8-char code.
  auth: none
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
- name: 200 Response
  request:
    url: '{{baseUrl}}/api/v1/invitations/:identifier/'
    method: GET
    params:
    - name: identifier
      value: ''
      type: path
  response:
    status: 200
    statusText: OK
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "code": "",
          "project_name": "",
          "role": "client",
          "role_label": "",
          "job_title": "",
          "invited_by_name": "",
          "is_usable": false,
          "requires_registration": true,
          "invitee_email": "",
          "invitee_phone": null,
          "invitee_first_name": "",
          "invitee_last_name": "",
          "expires_at": ""
        }
docs: |-
  Public lookup. Resolves an invitation by either the long URL-safe token
  (deep-link) or the short 8-char code (manual entry). Mobile uses the
  `requires_registration` flag to decide between accept (existing user) and
  redeem (new user). No auth required.
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });

    test("Response is JSON", function() {
      const contentType = res.getHeader("Content-Type");
      expect(contentType).to.contain("application/json");
    });
