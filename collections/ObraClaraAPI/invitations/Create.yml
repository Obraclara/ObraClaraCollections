info:
  name: Create
  type: http
  seq: 2
  tags:
    - invitations

http:
  method: POST
  url: "{{baseUrl}}/api/v1/projects/:project_pk/invitations/"
  params:
    - name: project_pk
      value: "{{project_pk}}"
      type: path
  body:
    type: json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response (new invitation)
    request:
      url: "{{baseUrl}}/api/v1/projects/:project_pk/invitations/"
      method: POST
      params:
        - name: project_pk
          value: "{{project_pk}}"
          type: path
      body:
        type: json
        data: |-
          {
            "role": "client",
            "job_title": "",
            "invitee_email": "",
            "invitee_phone": "",
            "invitee_first_name": "",
            "invitee_last_name": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "token": "",
            "code": "",
            "project": "",
            "project_name": "",
            "role": "client",
            "role_label": "",
            "job_title": "",
            "invitee_email": "",
            "invitee_phone": null,
            "invitee_first_name": "",
            "invitee_last_name": "",
            "invited_by": {
              "id": "",
              "email": "",
              "first_name": "",
              "last_name": "",
              "profile_image": ""
            },
            "status": "pending",
            "accepted_by": null,
            "is_expired": false,
            "is_usable": true,
            "expires_at": "",
            "created": "",
            "reused": false
          }
  - name: 200 Response (reused pending invitation)
    request:
      url: "{{baseUrl}}/api/v1/projects/:project_pk/invitations/"
      method: POST
      params:
        - name: project_pk
          value: "{{project_pk}}"
          type: path
      body:
        type: json
        data: |-
          {
            "role": "client",
            "invitee_email": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "token": "",
            "code": "",
            "project": "",
            "project_name": "",
            "role": "client",
            "role_label": "",
            "job_title": "",
            "invitee_email": "",
            "invitee_phone": null,
            "invitee_first_name": "",
            "invitee_last_name": "",
            "invited_by": {
              "id": "",
              "email": "",
              "first_name": "",
              "last_name": "",
              "profile_image": ""
            },
            "status": "pending",
            "accepted_by": null,
            "is_expired": false,
            "is_usable": true,
            "expires_at": "",
            "created": "",
            "reused": true
          }

docs: |-
  Create a project invitation. OWNER only. Idempotent on
  `(project, invitee_email/phone)`: if a pending invitation already exists
  it is reused and a resend email is fired (response status 200).
  Otherwise a new invitation is created (status 201). Body must include
  `role` (cannot be OWNER) and at least one of `invitee_email` or
  `invitee_phone`. `invitee_first_name`, `invitee_last_name` and
  `job_title` are optional prefills.
script:
  tests: |-
    test("Status is 200 or 201", function() {
      expect(res.getStatus()).to.be.oneOf([200, 201]);
    });

    test("Response has id", function() {
      const body = res.getBody();
      expect(body.id).to.be.a("string");
    });
