info:
  name: Accept
  type: http
  seq: 5
  tags:
  - invitations
http:
  method: POST
  url: '{{baseUrl}}/api/v1/invitations/:identifier/accept/'
  params:
  - name: identifier
    value: ''
    type: path
    description: Invitation token (URL-safe) or short 8-char code.
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
- name: 201 Response
  request:
    url: '{{baseUrl}}/api/v1/invitations/:identifier/accept/'
    method: POST
    params:
    - name: identifier
      value: ''
      type: path
  response:
    status: 201
    statusText: Created
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "id": "",
          "user": {
            "id": "",
            "email": "",
            "first_name": "",
            "last_name": "",
            "phone_number": "",
            "profile_image": ""
          },
          "role": "client",
          "role_label": "",
          "job_title": "",
          "is_active": true,
          "joined_at": ""
        }
docs: |-
  Accept an invitation as an already-authenticated user. Identifier may be
  the long URL-safe token (deep-link) or the short 8-char code (manual
  entry). Atomic: validates the identifier, creates or reactivates the
  `ProjectParticipant`, marks the invitation accepted. Idempotent — if the
  user is already an active participant, the existing participant is
  returned and the invitation is still marked accepted. Returns 410 if
  the invitation has expired.
script:
  tests: |-
    test("Status is 201", function() {
      expect(res.getStatus()).to.equal(201);
    });

    test("Response is JSON", function() {
      const contentType = res.getHeader("Content-Type");
      expect(contentType).to.contain("application/json");
    });
