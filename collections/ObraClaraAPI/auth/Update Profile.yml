info:
  name: Update Profile
  type: http
  seq: 9
  tags:
  - auth
http:
  method: PUT
  url: '{{baseUrl}}/api/v1/auth/me/'
  body:
    type: json
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
- name: 200 Response
  request:
    url: '{{baseUrl}}/api/v1/auth/me/'
    method: PUT
    body:
      type: json
      data: |-
        {
          "first_name": "",
          "last_name": "",
          "phone_number": "",
          "profile_image": "",
          "date_of_birth": ""
        }
  response:
    status: 200
    statusText: OK
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "id": "",
          "email": "",
          "username": "",
          "first_name": "",
          "last_name": "",
          "phone_number": "",
          "profile_image": "",
          "profile_image_thumb": null,
          "date_of_birth": "",
          "role": "",
          "preferences": {
            "notifications_enabled": true,
            "language": "es",
            "timezone": "America/Mexico_City"
          },
          "created": ""
        }
docs: |-
  Replace the authenticated user profile (full update). `username` is
  writable (3-30 chars, `[a-z0-9_.-]`, lowercased, unique case-insensitive);
  `email` and `role` are read-only. Send as `multipart/form-data` when it
  carries `profile_image`.
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });
