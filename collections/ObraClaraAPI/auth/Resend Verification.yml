info:
  name: Resend Verification
  type: http
  seq: 13
  tags:
  - auth
http:
  method: POST
  url: '{{baseUrl}}/api/v1/auth/resend-verification/'
  body:
    type: json
  auth: none
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
- name: 200 Response
  request:
    url: '{{baseUrl}}/api/v1/auth/resend-verification/'
    method: POST
    body:
      type: json
      data: |-
        {
          "login": "",
          "password": ""
        }
  response:
    status: 200
    statusText: OK
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "detail": ""
        }
docs: |-
  Resend the confirmation email for the account matching the given login
  credentials. Public but credential-checked (shares the `login` throttle
  scope). `login` accepts the same identifier as the login endpoint
  (username or email); demanding the password keeps the address out of the
  response. Answers the same whether or not the address was already verified.

  Accepts the following POST parameters: login, password.
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });
