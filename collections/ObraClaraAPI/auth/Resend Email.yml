info:
  name: Resend Email
  type: http
  seq: 7
  tags:
  - auth
http:
  method: POST
  url: '{{baseUrl}}/api/v1/auth/register/resend-email/'
  body:
    type: json
  auth: none
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
- name: 200 Response
  request:
    url: '{{baseUrl}}/api/v1/auth/register/resend-email/'
    method: POST
    body:
      type: json
      data: |-
        {
          "email": ""
        }
  response:
    status: 200
    statusText: OK
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "detail": ""
        }
docs: |-
  Resend the confirmation email to a bare address (post-signup screen).
  Public. Always answers 200 so it never reveals whether an account exists;
  a per-address cooldown bounds inbox flooding.

  Accepts the following POST parameter: email.
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });
