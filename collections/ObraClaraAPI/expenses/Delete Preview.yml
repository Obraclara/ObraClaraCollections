info:
  name: Delete Preview
  type: http
  seq: 9
  tags:
  - expenses
http:
  method: GET
  url: '{{baseUrl}}/api/v1/projects/:project_pk/expenses/:id/delete-preview/'
  params:
  - name: project_pk
    value: ''
    type: path
  - name: id
    value: ''
    type: path
    description: UUID of the expense.
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
- name: 200 Response
  request:
    url: '{{baseUrl}}/api/v1/projects/:project_pk/expenses/:id/delete-preview/'
    method: GET
    params:
    - name: project_pk
      value: ''
      type: path
    - name: id
      value: ''
      type: path
  response:
    status: 200
    statusText: OK
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "links": {
            "media_files": {"count": 0}
          },
          "warnings": [],
          "defaults": {
            "media_files": "delete"
          }
        }
docs: |-
  Cascade preview for soft-deleting an expense. Lists media file count and
  default cascade choice. Permission: OWNER only (delete on expenses).
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });

    test("Response is JSON", function() {
      const contentType = res.getHeader("Content-Type");
      expect(contentType).to.contain("application/json");
    });
