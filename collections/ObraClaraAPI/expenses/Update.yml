http:
  method: PUT
  url: '{{baseUrl}}/api/v1/projects/:project_pk/expenses/:id/'
  params:
  - name: id
    value: ''
    type: path
    description: Un Cadena UUID que identifique este expense.
  - name: project_pk
    value: ''
