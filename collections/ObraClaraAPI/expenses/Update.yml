  body:
    type: json
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
- name: 200 Response
  request:
    url: '{{baseUrl}}/api/v1/projects/:project_pk/expenses/:id/'
    method: PUT
    params:
    - name: id
      value: ''
      type: path
      description: Un Cadena UUID que identifique este expense.
    - name: project_pk
      value: ''
      type: path
    body:
      type: json
      data: |-
        {
          "progress_entry": "",
          "supplier": "",
          "base_category": null,
          "custom_category": null,
          "amount": "",
          "concept": "",
          "date": "",
          "visible_to_client": false
        }
  response:
    status: 200
    statusText: OK
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "id": "",
          "progress_entry": "",
          "supplier": "",
          "category": {
            "source": "",
            "code": null,
            "id": null,
            "name": "",
            "image": null
          },
          "amount": "",
          "concept": "",
          "date": "",
          "visible_to_client": false
        }
docs: |-
  CRUD for expenses scoped to a project.
  Set either `base_category` (bundled enum, 1-7) or `custom_category`
  (project category UUID) — mutually exclusive. The response `category` is a
  normalized object `{source, code, id, name, image}` (null when uncategorized).
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });
