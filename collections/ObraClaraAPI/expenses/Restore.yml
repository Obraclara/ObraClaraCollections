info:
  name: Restore
  type: http
  seq: 10
  tags:
  - expenses
http:
  method: POST
  url: '{{baseUrl}}/api/v1/projects/:project_pk/expenses/:id/restore/'
  params:
  - name: project_pk
    value: ''
    type: path
  - name: id
    value: ''
    type: path
    description: UUID of the soft-deleted expense.
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
- name: 200 Response
  request:
    url: '{{baseUrl}}/api/v1/projects/:project_pk/expenses/:id/restore/'
    method: POST
    params:
    - name: project_pk
      value: ''
      type: path
    - name: id
      value: ''
      type: path
  response:
    status: 200
    statusText: OK
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "id": "",
          "project": "",
          "progress_entry": "",
          "supplier": "",
          "category": {
            "source": "base",
            "code": 1,
            "id": null,
            "name": "Materials",
            "image": null
          },
          "amount": "",
          "concept": "",
          "date": "",
          "visible_to_client": false,
          "created_by": "",
          "created": "",
          "edited_at": "",
          "modified": ""
        }
docs: |-
  Restore a soft-deleted expense. No body, no query params. Hard-deleted
  media files do NOT cascade-restore — they are gone. Responds 400 if the
  parent project is still soft-deleted. Permission: OWNER only.
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });

    test("Response is JSON", function() {
      const contentType = res.getHeader("Content-Type");
      expect(contentType).to.contain("application/json");
    });
