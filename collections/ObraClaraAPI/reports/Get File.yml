info:
  name: Get File
  type: http
  seq: 10
  tags:
    - reports

http:
  method: GET
  url: "{{baseUrl}}/api/v1/projects/:project_pk/reports/:id/file/"
  params:
    - name: project_pk
      value: "{{project_pk}}"
      type: path
    - name: id
      value: "{{report_id}}"
      type: path
      description: UUID del report.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/v1/projects/:project_pk/reports/:id/file/"
      method: GET
      params:
        - name: project_pk
          value: ""
          type: path
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "title": "",
            "period_start": "",
            "period_end": "",
            "status": "published",
            "published_at": "",
            "pdf_file": ""
          }

docs: |-
  Lightweight tap-to-download payload: the PDF link plus header metadata, without the heavy data_snapshot of the detail endpoint.
  VIEWER/CLIENT only see published reports (same role visibility as the report detail).
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });

    test("Response is JSON", function() {
      const contentType = res.getHeader("Content-Type");
      expect(contentType).to.contain("application/json");
    });
