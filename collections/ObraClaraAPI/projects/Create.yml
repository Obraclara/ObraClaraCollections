info:
  name: Create
  type: http
  seq: 2
  tags:
    - projects

http:
  method: POST
  url: "{{baseUrl}}/api/v1/projects/"
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    request:
      url: "{{baseUrl}}/api/v1/projects/"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "project_type": "construction",
            "image": "",
            "location": "",
            "budget_estimated": "",
            "start_date": "",
            "end_date": "",
            "client_invitation": {
              "invitee_email": "",
              "invitee_phone": "",
              "invitee_first_name": "",
              "invitee_last_name": ""
            }
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "project_type": "construction",
            "image": "",
            "location": "",
            "budget_estimated": "",
            "start_date": "",
            "end_date": "",
            "created_by": "",
            "created": "",
            "modified": ""
          }

docs: |-
  Create a new project. The authenticated user becomes the OWNER. The
  optional `client_invitation` block creates a CLIENT invitation in the
  same transaction (idempotent on email/phone). When uploading the
  `image` as `multipart/form-data`, send `client_invitation` as a
  JSON-encoded string — the backend uses `JSONOrDictField` to decode it.
script:
  post-response: |-
    const body = res.getBody();
    if (body.id) {
      bru.setEnvVar("project_pk", body.id);
    }
  tests: |-
    test("Status is 201", function() {
      expect(res.getStatus()).to.equal(201);
    });

    test("Response has id", function() {
      const body = res.getBody();
      expect(body.id).to.be.a("string");
    });
