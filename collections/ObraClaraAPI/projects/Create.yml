info:
  name: Create
  type: http
  seq: 2
  tags:
    - projects

http:
  method: POST
  url: "{{baseUrl}}/api/v1/projects/"
  body:
    type: json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    request:
      url: "{{baseUrl}}/api/v1/projects/"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "project_type": "construction",
            "image": "",
            "location": "",
            "budget_estimated": "",
            "start_date": "",
            "end_date": "",
            "client_invitation": {
              "invitee_email": "",
              "invitee_phone": "",
              "invitee_first_name": "",
              "invitee_last_name": ""
            }
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "project_type": "construction",
            "image": "",
            "image_thumb": "",
            "location": "",
