info:
  name: Quotas
  type: http
  seq: 10
  tags:
    - projects

http:
  method: GET
  url: "{{baseUrl}}/api/v1/projects/:project_pk/quotas/"
  params:
    - name: project_pk
      value: "{{project_pk}}"
      type: path
      description: UUID of the project.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/v1/projects/:project_pk/quotas/"
      method: GET
      params:
        - name: project_pk
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "storage_bytes": {
              "used": 0,
              "limit": null
            },
            "collaborators_per_project": {
              "used": 0,
              "limit": null
            }
          }

docs: |-
  Per-project quota usage for storage and collaborators. Each entry reports
  this project's own usage and the limit from the project owner's plan
  (limit null = unlimited or no subscription). Readable by any active
  participant (HasProjectPermission). Permission: OWNER, COLLABORATOR,
  VIEWER, CLIENT.
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });

    test("Response is JSON", function() {
      const contentType = res.getHeader("Content-Type");
      expect(contentType).to.contain("application/json");
    });
