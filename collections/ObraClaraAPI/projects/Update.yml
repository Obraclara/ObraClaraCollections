http:
  method: PUT
  url: "{{baseUrl}}/api/v1/projects/:id/"
  params:
    - name: id
      value: ""
      type: path
      description: "UUID del project."
  body:
    type: json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

