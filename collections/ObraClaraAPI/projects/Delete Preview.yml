info:
  name: Delete Preview
  type: http
  seq: 8
  tags:
  - projects
http:
  method: GET
  url: '{{baseUrl}}/api/v1/projects/:id/delete-preview/'
  params:
  - name: id
    value: ''
    type: path
    description: UUID of the project.
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
- name: 200 Response
  request:
    url: '{{baseUrl}}/api/v1/projects/:id/delete-preview/'
    method: GET
    params:
    - name: id
      value: ''
      type: path
  response:
    status: 200
    statusText: OK
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "links": {
            "stages":           {"count": 0},
            "progress_entries": {"count": 0},
            "expenses":         {"count": 0, "total_amount": "0.00"},
            "incidents":        {"count": 0},
            "media_files":      {"count": 0}
          },
          "warnings": [
            "All listed records will be soft-deleted. Media files will be permanently removed. Published reports are unaffected (snapshot frozen)."
          ]
        }
docs: |-
  Counts of descendants that will be soft-deleted (stages, progress entries,
  expenses, incidents) and hard-deleted (media files) if the project is
  removed. No defaults — project delete is all-or-nothing. Permission:
  OWNER only (HasProjectPermission with delete on projects).
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });

    test("Response is JSON", function() {
      const contentType = res.getHeader("Content-Type");
      expect(contentType).to.contain("application/json");
    });
