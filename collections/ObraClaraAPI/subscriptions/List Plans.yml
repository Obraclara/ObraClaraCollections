info:
  name: List Plans
  type: http
  seq: 1
  tags:
    - subscriptions

http:
  method: GET
  url: "{{baseUrl}}/api/v1/subscriptions/plans/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/v1/subscriptions/plans/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "name": "Solo",
              "tier": "solo",
              "quotas": {
                "active_projects": 3,
                "collaborators_per_project": 3,
                "storage_bytes": 10737418240,
                "reports_per_month": 20,
                "custom_categories": 15
              },
              "features": {
                "charts_in_reports": true,
                "recurring_reports": false,
                "white_label": false
              },
              "prices": [
                {
                  "id": "",
                  "provider": "stripe",
                  "interval": "monthly",
                  "amount": "199.00",
                  "currency": "MXN"
                }
              ]
            }
          ]

docs: |-
  List the active catalog plans with their active prices.
  Use a price's `id` (a PlanPrice UUID, NOT the Stripe price_xxx) as the
  `price_id` for Create Checkout. The post-response script auto-saves the
  first available price id into the `price_id` environment variable.
script:
  post-response: |-
    const body = res.getBody();
    if (Array.isArray(body)) {
      for (const plan of body) {
        if (plan.prices && plan.prices.length) {
          bru.setEnvVar("price_id", plan.prices[0].id);
          break;
        }
      }
    }
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });

    test("Response is JSON", function() {
      const contentType = res.getHeader("Content-Type");
      expect(contentType).to.contain("application/json");
    });
