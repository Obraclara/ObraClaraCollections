info:
  name: List Invoices
  type: http
  seq: 3
  tags:
    - subscriptions

http:
  method: GET
  url: "{{baseUrl}}/api/v1/subscriptions/invoices/"
  params:
    - name: ordering
      value: ""
      type: query
      description: "Que campo usar para ordenar los resultados."
      disabled: true
    - name: page
      value: ""
      type: query
      description: "Un numero de pagina dentro del conjunto de resultados paginado."
      disabled: true
    - name: page_size
      value: ""
      type: query
      description: "Numero de resultados a devolver por pagina."
      disabled: true
    - name: search
      value: ""
      type: query
      description: "Un termino de busqueda."
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/v1/subscriptions/invoices/"
      method: GET
      params:
        - name: ordering
          value: ""
          type: query
          disabled: true
        - name: page
          value: ""
          type: query
          disabled: true
        - name: page_size
          value: ""
          type: query
          disabled: true
        - name: search
          value: ""
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "count": 0,
            "next": null,
            "previous": null,
            "results": []
          }

docs: List the caller's past invoices (paid payments, append-only snapshots).
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });

    test("Response is JSON", function() {
      const contentType = res.getHeader("Content-Type");
      expect(contentType).to.contain("application/json");
    });
