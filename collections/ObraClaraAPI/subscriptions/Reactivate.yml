info:
  name: Reactivate
  type: http
  seq: 10
  tags:
    - subscriptions

http:
  method: POST
  url: "{{baseUrl}}/api/v1/subscriptions/reactivate/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/v1/subscriptions/reactivate/"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": "Subscription reactivated."
          }

docs: |-
  Undo a scheduled at-period-end cancellation so the subscription renews
  instead of ending. Only valid while the cancellation is still pending
  (access_state "ending_soon"); the state is mirrored locally, so Get Mine
  flips back to access_state "active" / cancel_at_period_end false right away.
  Returns 400 if there is no pending cancellation or no active paid
  subscription.
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });
