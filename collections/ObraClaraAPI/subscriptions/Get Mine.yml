info:
  name: Get Mine
  type: http
  seq: 2
  tags:
    - subscriptions

http:
  method: GET
  url: "{{baseUrl}}/api/v1/subscriptions/me/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/v1/subscriptions/me/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "active",
            "plan_name": "Solo",
            "tier": "solo",
            "can_write": true,
            "trial_ends_at": null,
            "current_period_start": "",
            "current_period_end": "",
            "cancel_at_period_end": false,
            "usage": {
              "active_projects": { "used": 2, "limit": 3 }
            }
          }

docs: |-
  Return the caller's subscription with effective limits and live usage.
  Source of truth for the UI: status, can_write (read-only when false),
  and the used/limit usage map. Poll this after Create Checkout until
  status flips to "active". Returns 404 if the account has no subscription.
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });

    test("Response is JSON", function() {
      const contentType = res.getHeader("Content-Type");
      expect(contentType).to.contain("application/json");
    });
