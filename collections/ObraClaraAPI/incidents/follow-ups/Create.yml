info:
  name: Create
  type: http
  seq: 2
  tags:
  - incidents
http:
  method: POST
  url: '{{baseUrl}}/api/v1/projects/:project_pk/incidents/:incident_pk/follow-ups/'
  params:
  - name: incident_pk
    value: ''
    type: path
  - name: project_pk
    value: ''
    type: path
  body:
    type: json
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
- name: 201 Response
  request:
    url: '{{baseUrl}}/api/v1/projects/:project_pk/incidents/:incident_pk/follow-ups/'
    method: POST
    params:
    - name: incident_pk
      value: ''
      type: path
    - name: project_pk
      value: ''
      type: path
    body:
      type: json
      data: |-
        {
          "id": "",
          "expected_created_by": "",
          "comment": "",
          "status": "",
          "visible_to_client": false,
          "edited_at": ""
        }
  response:
    status: 201
    statusText: Created
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "id": "",
          "comment": "",
          "status": "",
          "visible_to_client": false,
          "created_by": "",
          "created": "",
          "edited_at": "",
          "modified": ""
        }
docs: |-
  List and create follow-ups for an incident.

  Idempotent create. The body may carry its own `id` (UUID v7). Without it,
  every request creates a new record. A retry with a stored `id` returns 200
  with the same payload. It skips validation and side effects.

  Optional `expected_created_by` must match the session user.

  Errors:
      - 400 bad_request: `id` is not a valid UUID v7
      - 403 owner_mismatch: `expected_created_by` differs from the session user
      - 409 id_conflict: the `id` belongs to another author or scope
script:
  post-response: |-
    const body = res.getBody();
    if (body.id) {
      bru.setEnvVar("followup_id", body.id);
    }
  tests: |-
    test("Status is 201", function() {
      expect(res.getStatus()).to.equal(201);
    });

    test("Response has id", function() {
      const body = res.getBody();
      expect(body.id).to.be.a("string");
    });
