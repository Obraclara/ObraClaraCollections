info:
  name: Restore
  type: http
  seq: 10
  tags:
  - incidents
http:
  method: POST
  url: '{{baseUrl}}/api/v1/projects/:project_pk/incidents/:id/restore/'
  params:
  - name: project_pk
    value: ''
    type: path
  - name: id
    value: ''
    type: path
    description: UUID of the soft-deleted incident.
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
- name: 200 Response
  request:
    url: '{{baseUrl}}/api/v1/projects/:project_pk/incidents/:id/restore/'
    method: POST
    params:
    - name: project_pk
      value: ''
      type: path
    - name: id
      value: ''
      type: path
  response:
    status: 200
    statusText: OK
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "id": "",
          "project": "",
          "reported_date": "",
          "priority": "",
          "incident_type": "",
          "impact_level": "",
          "description": "",
          "action_plan": "",
          "status": "",
          "responsible": "",
          "progress_entry": "",
          "created_by": "",
          "follow_ups_count": 0,
          "created": "",
          "modified": ""
        }
docs: |-
  Restore a soft-deleted incident. Hard-deleted follow-ups do NOT come back.
  Media files marked orphan stay orphaned; media files marked delete are
  gone. Responds 400 if the parent project is still soft-deleted.
  Permission: OWNER only.
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });

    test("Response is JSON", function() {
      const contentType = res.getHeader("Content-Type");
      expect(contentType).to.contain("application/json");
    });
