info:
  name: Delete Preview
  type: http
  seq: 9
  tags:
  - incidents
http:
  method: GET
  url: '{{baseUrl}}/api/v1/projects/:project_pk/incidents/:id/delete-preview/'
  params:
  - name: project_pk
    value: ''
    type: path
  - name: id
    value: ''
    type: path
    description: UUID of the incident.
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
- name: 200 Response
  request:
    url: '{{baseUrl}}/api/v1/projects/:project_pk/incidents/:id/delete-preview/'
    method: GET
    params:
    - name: project_pk
      value: ''
      type: path
    - name: id
      value: ''
      type: path
  response:
    status: 200
    statusText: OK
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "links": {
            "media_files": {"count": 0},
            "follow_ups":  {"count": 0}
          },
          "warnings": [],
          "defaults": {
            "media_files": "delete"
          }
        }
docs: |-
  Cascade preview for soft-deleting an incident. follow_ups is informational
  only — they are hard-cascaded regardless of choice. media_files supports
  orphan/delete, default delete. Permission: OWNER only.
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });

    test("Response is JSON", function() {
      const contentType = res.getHeader("Content-Type");
      expect(contentType).to.contain("application/json");
    });
