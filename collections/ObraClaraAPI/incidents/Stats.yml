info:
  name: Stats
  type: http
  seq: 8
  tags:
  - incidents
http:
  method: GET
  url: '{{baseUrl}}/api/v1/incidents/stats/'
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
- name: 200 Response
  request:
    url: '{{baseUrl}}/api/v1/incidents/stats/'
    method: GET
  response:
    status: 200
    statusText: OK
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "total": 0,
          "in_progress": 0,
          "high_priority": 0
        }
docs: |-
  Global incident counts across all projects where the user participates.
  Returns: total, in_progress (status=in_progress), high_priority (priority=high).
  No filters; the response is the global aggregate for the user.
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });

    test("Response is JSON", function() {
      const contentType = res.getHeader("Content-Type");
      expect(contentType).to.contain("application/json");
    });
