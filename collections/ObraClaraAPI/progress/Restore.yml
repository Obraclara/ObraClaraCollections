info:
  name: Restore
  type: http
  seq: 10
  tags:
  - progress
http:
  method: POST
  url: '{{baseUrl}}/api/v1/projects/:project_pk/progress/:id/restore/'
  params:
  - name: project_pk
    value: ''
    type: path
  - name: id
    value: ''
    type: path
    description: UUID of the soft-deleted progress entry.
  - name: cascade
    value: ''
    type: query
    description: 'If true, also restores rows that share the original delete_batch_id.'
    disabled: true
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
examples:
- name: 200 Response
  request:
    url: '{{baseUrl}}/api/v1/projects/:project_pk/progress/:id/restore/'
    method: POST
    params:
    - name: project_pk
      value: ''
      type: path
    - name: id
      value: ''
      type: path
    - name: cascade
      value: ''
      type: query
      disabled: true
  response:
    status: 200
    statusText: OK
    headers:
    - name: Content-Type
      value: application/json
    body:
      type: json
      data: |-
        {
          "id": "",
          "project": "",
          "stage": "",
          "description": "",
          "date": "",
          "percentage_delta": "0.00",
          "accumulated_progress": "0.00",
          "total_expenses": "0.00",
          "visible_to_client": false,
          "created_by": "",
          "created": "",
          "modified": ""
        }
docs: |-
  Restore a soft-deleted progress entry. With cascade=true, also restores
  rows sharing the original delete_batch_id. Does NOT re-link orphaned
  children. Returns 409 Conflict if percentage_delta would push the stage
  past 100%. Responds 400 if the parent project is still soft-deleted.
  Permission: OWNER only.
script:
  tests: |-
    test("Status is 200", function() {
      expect(res.getStatus()).to.equal(200);
    });

    test("Response is JSON", function() {
      const contentType = res.getHeader("Content-Type");
      expect(contentType).to.contain("application/json");
    });
