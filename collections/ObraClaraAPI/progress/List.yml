info:
  name: List
  type: http
  seq: 3
  tags:
    - progress

http:
  method: GET
  url: "{{baseUrl}}/api/v1/projects/:project_pk/progress/"
  params:
    - name: date_from
      value: ""
      type: query
      description: Fecha mínima (YYYY-MM-DD).
      disabled: true
    - name: date_to
      value: ""
      type: query
      description: Fecha máxima (YYYY-MM-DD).
      disabled: true
    - name: ordering
      value: ""
      type: query
      description: Qué campo usar para ordenar los resultados.
      disabled: true
    - name: page
      value: ""
      type: query
      description: Un número de página dentro del conjunto de resultados paginado.
      disabled: true
    - name: page_size
      value: ""
      type: query
      description: Número de resultados a devolver por página.
      disabled: true
    - name: project_pk
      value: "{{project_pk}}"
      type: path
    - name: search
      value: ""
      type: query
      description: Un término de búsqueda.
      disabled: true
    - name: stage
      value: ""
      type: query
      description: Filtrar por etapa (UUID).
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

