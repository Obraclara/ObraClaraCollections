info:
  name: Create
  type: http
  seq: 4
  tags:
    - progress

http:
  method: POST
  url: "{{baseUrl}}/api/v1/projects/:project_pk/progress/"
  params:
    - name: project_pk
      value: "{{project_pk}}"
      type: path
  body:
    type: json
    data: |-
      {
        "stage": "ae8d8fa9-ef7c-4bf7-9ceb-e50a387ae40c",
        "description": "Testin Nots",
        "date": "2026-02-2",
        "percentage_delta": "1"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    request:
      url: "{{baseUrl}}/api/v1/projects/:project_pk/progress/"
      method: POST
      params:
        - name: project_pk
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "id": "",
            "expected_created_by": "",
            "stage": "",
            "description": "",
            "date": "",
            "percentage_delta": "",
            "edited_at": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "stage": "",
            "description": "",
            "date": "",
            "percentage_delta": "",
            "accumulated_progress": "",
            "total_expenses": "",
            "created_by": "",
            "created": "",
            "edited_at": "",
            "modified": ""
          }

docs: |-
  Use InputSerializer for validation, DetailSerializer for response.

  Idempotent create. The body may carry its own `id` (UUID v7). Without it,
  every request creates a new record. A retry with a stored `id` returns 200
  with the same payload. It skips validation and side effects.

  Optional `expected_created_by` must match the session user.

  Errors:
      - 400 bad_request: `id` is not a valid UUID v7
      - 403 owner_mismatch: `expected_created_by` differs from the session user
      - 409 id_conflict: the `id` belongs to another author or scope
      - 409 resource_deleted: the `id` is your own soft-deleted record (`details.deleted_at`)
      - 400 stage_progress_exceeded: the delta pushes the stage past 100%
        (`details`: stage, base, used, available, percentage_delta)
script:
  tests: |-
    test("Status is 201", function() {
      expect(res.getStatus()).to.equal(201);
    });

    test("Response has id", function() {
      const body = res.getBody();
      expect(body.id).to.be.a("string");
    });
